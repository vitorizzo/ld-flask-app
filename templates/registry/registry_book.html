{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/registry_tools.css', v=app_version ~ '-book2') }}">
{% endblock %}

{% block content %}
<section class="welcome-section page-shell registry-tools-section registry-book-page" data-kind="{{ kind }}">
  <div class="container-fluid h-100 d-flex flex-column">
    <div class="registry-book-header">
      <div>
        <h1 class="h4 mb-1">{{ title }}</h1>
      </div>
      <div class="registry-book-tools">
        <div class="input-group registry-book-search">
          <input class="form-control" id="registrySearch" autocomplete="off" placeholder="Nome, P.IVA, codice, contatto">
          <button class="btn btn-info" id="registrySearchBtn" type="button">Cerca</button>
        </div>
        <button class="btn btn-outline-secondary" type="button" id="registryResetBtn">Tutti</button>
      </div>
    </div>

    <div class="registry-book-layout flex-grow-1 min-h-0 d-flex gap-3">
      <div class="registry-book-main flex-grow-1 min-h-0">
        <div class="registry-book-list" id="registryBookList">
          <div class="text-muted">Caricamento...</div>
        </div>
      </div>

      <aside class="registry-book-index" id="registryBookIndex" aria-label="Indice alfabetico">
        <button type="button" class="registry-book-index__item" data-letter="#">#</button>
        {% for letter in "ABCDEFGHIJKLMNOPQRSTUVWXYZ" %}
          <button type="button" class="registry-book-index__item" data-letter="{{ letter }}">{{ letter }}</button>
        {% endfor %}
      </aside>
    </div>
  </div>
</section>

<div class="modal fade registry-tools-modal" id="contactLinkModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="contactLinkModalTitle">Contatto</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Chiudi"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="contactRegistryId">
        <input type="hidden" id="contactId">
        <div class="row g-2">
          <div class="col-12 col-md-6">
            <label class="form-label" for="contactDisplayName">Nome contatto</label>
            <input class="form-control" id="contactDisplayName" autocomplete="off">
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label" for="contactRole">Ruolo</label>
            <input class="form-control" id="contactRole" autocomplete="off" placeholder="Agente, socio, amministrazione...">
          </div>
        </div>
        <div class="row g-2 mt-1">
          <div class="col-12 col-md-4">
            <label class="form-label" for="contactPointType">Tipo</label>
            <select class="form-select" id="contactPointType">
              <option value="phone">Telefono</option>
              <option value="mobile">Cellulare</option>
              <option value="email">Email</option>
              <option value="pec">PEC</option>
            </select>
          </div>
          <div class="col-12 col-md-8">
            <label class="form-label" for="contactPointValue">Valore</label>
            <input class="form-control" id="contactPointValue" type="tel" inputmode="tel" autocomplete="tel">
          </div>
        </div>
        <div class="mt-2">
          <label class="form-label" for="contactNotes">Note</label>
          <textarea class="form-control" id="contactNotes" rows="3"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <div class="contact-form-feedback" id="contactFormFeedback" role="status" aria-live="polite"></div>
        <button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">Annulla</button>
        <button class="btn btn-info" type="button" id="contactSaveBtn">Salva</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
(() => {
  const kind = document.querySelector(".registry-book-page")?.dataset.kind || "customer";
  const listEl = document.getElementById("registryBookList");
  const indexEl = document.getElementById("registryBookIndex");
  const searchInput = document.getElementById("registrySearch");
  const searchBtn = document.getElementById("registrySearchBtn");
  const resetBtn = document.getElementById("registryResetBtn");
  const modalEl = document.getElementById("contactLinkModal");
  let modal = null;
  const saveBtn = document.getElementById("contactSaveBtn");
  let registries = [];

  if (modalEl) {
    if (modalEl.parentElement !== document.body) {
      document.body.appendChild(modalEl);
    }
    modalEl.addEventListener("show.bs.modal", () => {
      document.body.classList.add("registry-tools-modal-open");
    });
    modalEl.addEventListener("hidden.bs.modal", () => {
      if (!document.querySelector(".registry-tools-modal.show")) {
        document.body.classList.remove("registry-tools-modal-open");
      }
    });
    modal = new bootstrap.Modal(modalEl);
  }

  const esc = value => String(value || "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));

  function displayLabel(registry) {
    return registry.display_name || registry.legal_name || registry.source_code || `Anagrafica ${registry.id}`;
  }

  function groupKey(label) {
    const letter = (label || "").trim().charAt(0).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
    return /^[A-Z]$/.test(letter) ? letter : "#";
  }

  const contactTypeLabels = {
    phone: "Telefono",
    mobile: "Cellulare",
    email: "Email",
    pec: "PEC",
  };

  function contactPointHtml(point) {
    const type = String(point.contact_type || point.type || "").toLowerCase();
    const value = String(point.value || "").trim();
    if (!value) return "";
    const label = point.label || contactTypeLabels[type] || type || "Contatto";
    let href = "";
    if (type === "phone" || type === "mobile") {
      href = `tel:${value.replace(/[^+0-9,;#*]/g, "")}`;
    } else if (type === "email" || type === "pec") {
      href = `mailto:${value}`;
    }
    const renderedValue = href
      ? `<a href="${esc(href)}">${esc(value)}</a>`
      : `<span>${esc(value)}</span>`;
    return `<div class="registry-contact-point"><span class="registry-contact-point__label">${esc(label)}</span><strong class="registry-contact-point__value">${renderedValue}</strong></div>`;
  }

  function contactPoints(contact) {
    return (contact.points || []).map(contactPointHtml).filter(Boolean).join("");
  }

  function registryContactHtml(link, registryId) {
    const c = link.contact || {};
    const points = contactPoints(c);
    return `
      <div class="registry-contact-row ${link.is_active ? "" : "registry-contact-row--inactive"}">
        <div class="registry-contact-row__main">
          <div class="registry-contact-name">${esc(c.display_name || "Contatto senza nome")}</div>
          <div class="registry-contact-meta">
            ${link.role ? `<span class="registry-contact-role">${esc(link.role)}</span>` : ""}
            ${points ? `<div class="registry-contact-points">${points}</div>` : ""}
          </div>
          ${link.notes ? `<div class="registry-contact-notes">${esc(link.notes)}</div>` : ""}
        </div>
        <div class="registry-contact-row__actions">
          <button class="btn btn-sm btn-outline-secondary" type="button" data-contact-edit="${registryId}:${c.id}">Modifica</button>
          <button class="btn btn-sm btn-outline-danger" type="button" data-contact-unlink="${registryId}:${c.id}">Dissocia</button>
        </div>
      </div>
    `;
  }

  function render() {
    const q = (searchInput.value || "").trim().toLowerCase();
    const filtered = registries.filter(reg => {
      if (!q) return true;
      const blob = [
        reg.display_name,
        reg.legal_name,
        reg.source_code,
        reg.vat_number,
        reg.tax_code,
        reg.city,
        ...(reg.contact_links || []).map(l => l.contact?.display_name || ""),
        ...(reg.legacy_contacts || []).map(c => c.value || ""),
      ].join(" ").toLowerCase();
      return blob.includes(q);
    });

    if (!filtered.length) {
      listEl.innerHTML = `<div class="alert alert-warning mb-0">Nessuna anagrafica trovata.</div>`;
      return;
    }

    const groups = new Map();
    filtered.sort((a, b) => displayLabel(a).localeCompare(displayLabel(b), "it", { sensitivity: "base" }))
      .forEach(reg => {
        const label = displayLabel(reg);
        const key = groupKey(label);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(reg);
      });

    const letters = Array.from(groups.keys()).sort((a, b) => {
      if (a === "#") return -1;
      if (b === "#") return 1;
      return a.localeCompare(b, "it");
    });

    listEl.innerHTML = letters.map(letter => `
      <section class="registry-letter-group" id="letter-${letter}" data-letter-group="${letter}">
        <div class="registry-letter-group__head">${letter}</div>
        <div class="registry-letter-group__body">
          ${groups.get(letter).map(reg => {
            const contacts = (reg.contact_links || []).filter(l => l.contact && l.contact.is_active !== false);
            const legacy = reg.legacy_contacts || [];
            return `
              <article class="registry-card" data-registry-id="${reg.id}">
                <button class="registry-card__head" type="button" data-registry-toggle="${reg.id}" aria-expanded="false">
                  <div>
                    <div class="registry-card__title">${esc(displayLabel(reg))}</div>
                    <div class="registry-card__meta">
                      ${esc([reg.source_code, reg.vat_number, [reg.city, reg.province].filter(Boolean).join(" ")].filter(Boolean).join(" · "))}
                    </div>
                  </div>
                  <span class="registry-card__chevron" aria-hidden="true"><i class="fa-solid fa-chevron-down"></i></span>
                </button>
                <div class="registry-card__body" hidden>
                  <div class="registry-card__actions">
                    <button class="btn btn-sm btn-info" type="button" data-contact-add="${reg.id}"><i class="fa-solid fa-plus"></i> Contatto</button>
                  </div>
                  <div class="registry-card__section registry-card__section--data">
                    <div class="registry-card__section-title">Dati anagrafici</div>
                    <div class="registry-data-grid">
                      ${reg.legal_name ? `<div><span>Ragione sociale</span><strong>${esc(reg.legal_name)}</strong></div>` : ""}
                      ${reg.address || reg.city ? `<div><span>Indirizzo</span><strong>${esc([reg.address, reg.zip_code, reg.city, reg.province].filter(Boolean).join(" "))}</strong></div>` : ""}
                      ${reg.vat_number ? `<div><span>P.IVA</span><strong>${esc(reg.vat_number)}</strong></div>` : ""}
                      ${reg.tax_code ? `<div><span>Codice fiscale</span><strong>${esc(reg.tax_code)}</strong></div>` : ""}
                    </div>
                  </div>
                  <div class="registry-card__section">
                    <div class="registry-card__section-title">Contatti associati</div>
                    ${contacts.length ? contacts.map(link => registryContactHtml(link, reg.id)).join("") : `<div class="text-muted small">Nessun contatto associato.</div>`}
                  </div>
                  <div class="registry-card__section">
                    <div class="registry-card__section-title">Contatti importati</div>
                    ${legacy.length ? legacy.map(item => `<div class="registry-legacy-item">${esc(item.contact_type)}: ${esc(item.value)}</div>`).join("") : `<div class="text-muted small">Nessun dato importato.</div>`}
                  </div>
                </div>
              </article>
            `;
          }).join("")}
        </div>
      </section>
    `).join("");
  }

  async function loadData() {
    listEl.innerHTML = `<div class="text-muted">Caricamento...</div>`;
    const q = (searchInput.value || "").trim();
    const res = await fetch(`/registry/api/registries?kind=${encodeURIComponent(kind)}&q=${encodeURIComponent(q)}`, { credentials: "same-origin" });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || "Errore caricamento");
    registries = data.registries || [];
    render();
  }

  function openContactModal(registryId, contact = null) {
    document.getElementById("contactLinkModalTitle").textContent = contact ? "Modifica contatto" : "Nuovo contatto";
    document.getElementById("contactRegistryId").value = registryId;
    document.getElementById("contactId").value = contact?.id || "";
    document.getElementById("contactDisplayName").value = contact?.display_name || "";
    document.getElementById("contactRole").value = contact?.role || "";
    document.getElementById("contactNotes").value = contact?.notes || "";
    const point = (contact?.points || [])[0] || {};
    document.getElementById("contactPointType").value = point.contact_type || "phone";
    document.getElementById("contactPointValue").value = point.value || "";
    syncContactPointInput();
    setContactFormFeedback();
    modal?.show();
  }

  function setContactFormFeedback(message = "", isError = false) {
    const feedback = document.getElementById("contactFormFeedback");
    feedback.textContent = message;
    feedback.classList.toggle("is-error", isError);
  }

  function syncContactPointInput() {
    const type = document.getElementById("contactPointType").value;
    const input = document.getElementById("contactPointValue");
    const isEmail = type === "email" || type === "pec";
    input.type = isEmail ? "email" : "tel";
    input.inputMode = isEmail ? "email" : "tel";
    input.autocomplete = isEmail ? "email" : "tel";
    input.placeholder = isEmail ? "nome@dominio.it" : "Numero di telefono";
  }

  async function saveContact() {
    const registryId = document.getElementById("contactRegistryId").value;
    const contactId = document.getElementById("contactId").value.trim();
    const displayName = document.getElementById("contactDisplayName").value.trim();
    const role = document.getElementById("contactRole").value.trim();
    const pointType = document.getElementById("contactPointType").value;
    const pointValue = document.getElementById("contactPointValue").value.trim();
    const notes = document.getElementById("contactNotes").value.trim();
    if (!registryId) return setContactFormFeedback("Anagrafica cliente non valida.", true);
    if (!displayName) return setContactFormFeedback("Inserisci il nome del contatto.", true);

    const payload = {
      display_name: displayName,
      role,
      notes,
      points: pointValue ? [{ contact_type: pointType, value: pointValue, is_primary: true }] : [],
    };

    saveBtn.disabled = true;
    setContactFormFeedback("Salvataggio in corso...");
    try {
      let res;
      if (contactId) {
        res = await fetch(`/registry/api/contacts/${contactId}`, {
          method: "PUT",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || "Errore aggiornamento contatto");
        const linkRes = await fetch(`/registry/api/registries/${registryId}/contacts`, {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contact_id: contactId, link_role: role, link_notes: notes }),
        });
        const linkData = await linkRes.json();
        if (!linkRes.ok || !linkData.ok) throw new Error(linkData.error || "Errore associazione contatto");
      } else {
        res = await fetch(`/registry/api/registries/${registryId}/contacts`, {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || "Errore salvataggio contatto");
      }
      modal?.hide();
      await loadData();
    } catch (err) {
      setContactFormFeedback(err.message || "Errore salvataggio", true);
    } finally {
      saveBtn.disabled = false;
    }
  }

  async function unlinkContact(registryId, contactId) {
    if (!confirm("Dissociare questo contatto dall'anagrafica?")) return;
    const res = await fetch(`/registry/api/registries/${registryId}/contacts/${contactId}`, {
      method: "DELETE",
      credentials: "same-origin",
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || "Errore dissociazione");
    await loadData();
  }

  listEl.addEventListener("click", async ev => {
    const toggle = ev.target.closest("[data-registry-toggle]");
    if (toggle) {
      const card = toggle.closest(".registry-card");
      const body = card?.querySelector(".registry-card__body");
      const isOpen = !card.classList.contains("is-open");
      card.classList.toggle("is-open", isOpen);
      if (body) body.hidden = !isOpen;
      toggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
      if (isOpen && window.matchMedia("(max-width: 820px), (hover: none) and (pointer: coarse)").matches) {
        window.setTimeout(() => card.scrollIntoView({ block: "start", behavior: "smooth" }), 60);
      }
      return;
    }
    const addBtn = ev.target.closest("[data-contact-add]");
    if (addBtn) {
      openContactModal(addBtn.dataset.contactAdd);
      return;
    }
    const editBtn = ev.target.closest("[data-contact-edit]");
    if (editBtn) {
      const [registryId, contactId] = editBtn.dataset.contactEdit.split(":");
      const registry = registries.find(r => String(r.id) === String(registryId));
      const link = registry?.contact_links?.find(item => String(item.contact_id) === String(contactId));
      openContactModal(registryId, link?.contact ? { ...link.contact, role: link.role, notes: link.notes } : null);
      return;
    }
    const unlinkBtn = ev.target.closest("[data-contact-unlink]");
    if (unlinkBtn) {
      const [registryId, contactId] = unlinkBtn.dataset.contactUnlink.split(":");
      try {
        await unlinkContact(registryId, contactId);
      } catch (err) {
        alert(err.message || "Errore dissociazione");
      }
    }
  });

  indexEl.addEventListener("click", ev => {
    const item = ev.target.closest("[data-letter]");
    if (!item) return;
    const target = document.getElementById(`letter-${item.dataset.letter}`);
    if (!target) return;
    target.scrollIntoView({ block: "start", behavior: "smooth" });
    indexEl.querySelectorAll(".registry-book-index__item").forEach(el => el.classList.toggle("active", el === item));
  });

  searchBtn.addEventListener("click", () => loadData().catch(err => {
    listEl.innerHTML = `<div class="alert alert-danger mb-0">${esc(err.message)}</div>`;
  }));

  searchInput.addEventListener("keydown", ev => {
    if (ev.key === "Enter") {
      ev.preventDefault();
      searchBtn.click();
    }
  });

  resetBtn.addEventListener("click", () => {
    searchInput.value = "";
    loadData().catch(err => {
      listEl.innerHTML = `<div class="alert alert-danger mb-0">${esc(err.message)}</div>`;
    });
  });

  saveBtn.addEventListener("click", saveContact);
  document.getElementById("contactPointType").addEventListener("change", syncContactPointInput);
  loadData().catch(err => {
    listEl.innerHTML = `<div class="alert alert-danger mb-0">${esc(err.message)}</div>`;
  });
})();
</script>
{% endblock %}
