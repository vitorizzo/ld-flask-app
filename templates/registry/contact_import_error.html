{% extends "base.html" %}

{% block title %}Importazione contatto{% endblock %}

{% block content %}
<section class="welcome-section page-shell">
  <div class="container py-4">
    <div class="card shadow-sm mx-auto" style="max-width: 720px;">
      <div class="card-body p-4 text-center">
        <i class="fa-solid fa-address-book fa-3x text-danger mb-3" aria-hidden="true"></i>
        <h1 class="h4">Contatto non importato</h1>
        <p class="text-muted">{{ error }}</p>
        <a class="btn btn-info" href="{{ url_for('registry.customers_book_page') }}">Apri rubrica clienti</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
