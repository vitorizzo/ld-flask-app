{% extends 'base.html' %}

{% block title %}LD Enoteca - Home{% endblock %}

{% block content %}
<section class="welcome-section">
  <!-- Sezione di ricerca barcode -->
  <div class="barcode-search">
    <label for="barcode">Inserisci il codice a barre:</label>
    <div class="input-group">
      <input type="text" id="barcode" placeholder="Codice a barre" class="form-control">
      <button id="search-button" class="btn btn-primary">Cerca</button>
      <button id="scan-button" class="btn btn-outline-secondary">📷</button>
    </div>
  </div>
</section>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/@zxing/library@latest"></script>
<script src="{{ url_for('static', filename='js/scanner.js') }}"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
  const searchButton = document.getElementById("search-button");
  searchButton.addEventListener("click", function() {
    const barcode = document.getElementById("barcode").value.trim();
    if (!barcode) {
      alert("Inserisci un codice a barre valido.");
      return;
    }
    fetch('/search/articoli_by_barcode_multipli?barcode=' + encodeURIComponent(barcode))
      .then(response => response.json())
      .then(data => {
        if (!data || !data.success) {
          alert(data?.error || "Prodotto non trovato!");
          return;
        }

        if (data.singolo && data.articolo?.cod_art) {
          window.location.href = '/search/scheda_articolo/' + encodeURIComponent(data.articolo.cod_art);
          return;
        }

        const articolo = data.articoli?.[0];
        if (articolo?.cod_art) {
          window.location.href = '/search/scheda_articolo/' + encodeURIComponent(articolo.cod_art);
          return;
        }

        alert("Barcode trovato, ma nessun articolo apribile.");
      })
      .catch(err => {
        console.error("Errore durante la fetch:", err);
        alert("Errore durante la ricerca del prodotto.");
      });
  });

  // Inizializza scanner con il nuovo modulo
  initScanner("scan-button", "barcode", () => {
    searchButton.click();
  });
});
</script>
{% endblock %}
