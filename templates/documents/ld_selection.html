{% extends "base.html" %}

{% block title %}LD Selection{% endblock %}

{% block content %}
<section class="welcome-section page-shell">
  <div class="container-fluid h-100 d-flex flex-column">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <div>
        <h1 class="mb-1">LD Selection</h1>
        <div class="text-muted">Catalogo PDF integrato nella webapp.</div>
      </div>
      <a class="btn btn-outline-light" href="{{ url_for('static', filename='documents/LD_Selection.pdf') }}" target="_blank" rel="noopener">
        Apri PDF
      </a>
    </div>
    <div class="flex-grow-1 min-h-0">
      <iframe
        src="{{ url_for('static', filename='documents/LD_Selection.pdf') }}"
        title="LD Selection PDF"
        style="width: 100%; height: 100%; min-height: 70vh; border: 0; background: #fff;">
      </iframe>
    </div>
  </div>
</section>
{% endblock %}
