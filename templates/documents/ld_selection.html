{% extends "base.html" %}

{% block title %}LD Selection{% endblock %}

{% block content %}
<section class="welcome-section page-shell">
  <div class="container-fluid h-100 d-flex flex-column">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <div>
        <h1 class="mb-1">LD Selection</h1>
        <div class="text-muted">Catalogo PDF integrato nella webapp.</div>
      </div>
      <a class="btn btn-outline-light" href="{{ pdf_url }}" target="_blank" rel="noopener">
        Apri PDF
      </a>
    </div>
    {% if can_share %}
    <div class="d-flex flex-wrap gap-2 mb-3">
      <button type="button" class="btn btn-light btn-sm" id="shareNativeBtn">
        <i class="fa-solid fa-share-nodes me-1"></i>Condividi
      </button>
      <a class="btn btn-outline-light btn-sm" href="mailto:?subject={{ 'LD Selection'|urlencode }}&body={{ ('Catalogo LD Selection: ' ~ pdf_url)|urlencode }}">
        <i class="fa-regular fa-envelope me-1"></i>Mail
      </a>
      <a class="btn btn-outline-light btn-sm" href="https://wa.me/?text={{ ('Catalogo LD Selection: ' ~ pdf_url)|urlencode }}" target="_blank" rel="noopener">
        <i class="fa-brands fa-whatsapp me-1"></i>WhatsApp
      </a>
      <a class="btn btn-outline-light btn-sm" href="https://t.me/share/url?url={{ pdf_url|urlencode }}&text={{ 'Catalogo LD Selection'|urlencode }}" target="_blank" rel="noopener">
        <i class="fa-brands fa-telegram me-1"></i>Telegram
      </a>
      <button type="button" class="btn btn-outline-light btn-sm" id="copyPdfLinkBtn">
        <i class="fa-regular fa-copy me-1"></i>Copia link
      </button>
    </div>
    {% endif %}
    <div class="flex-grow-1 min-h-0">
      <iframe
        src="{{ pdf_url }}"
        title="LD Selection PDF"
        style="width: 100%; height: 100%; min-height: 70vh; border: 0; background: #fff;">
      </iframe>
    </div>
  </div>
</section>
{% endblock %}

{% block scripts %}
  {{ super() }}
  {% if can_share %}
  <script>
    (function () {
      const pdfUrl = {{ pdf_url|tojson }};
      const shareTitle = "LD Selection";
      const shareText = "Catalogo LD Selection";
      const nativeBtn = document.getElementById("shareNativeBtn");
      const copyBtn = document.getElementById("copyPdfLinkBtn");

      if (nativeBtn) {
        nativeBtn.addEventListener("click", async () => {
          try {
            if (navigator.share) {
              await navigator.share({ title: shareTitle, text: shareText, url: pdfUrl });
              return;
            }
            await navigator.clipboard.writeText(pdfUrl);
            nativeBtn.innerHTML = '<i class="fa-regular fa-copy me-1"></i>Link copiato';
          } catch (err) {
            console.warn("Share failed", err);
          }
        });
      }

      if (copyBtn) {
        copyBtn.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(pdfUrl);
            copyBtn.innerHTML = '<i class="fa-regular fa-copy me-1"></i>Link copiato';
          } catch (err) {
            console.warn("Copy failed", err);
          }
        });
      }
    })();
  </script>
  {% endif %}
{% endblock %}
