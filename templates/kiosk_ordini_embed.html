{% extends "base.html" %}

{% block title %}LD Enoteca - Bacheca ordini{% endblock %}

{% block extra_css %}
  {{ super() }}
  <style>
    .kiosk-embed-page {
      width: 100%;
      max-width: none;
      height: 100%;
      margin: 0;
      padding: 18px;
      overflow: hidden;
    }

    .kiosk-embed-page > .container-fluid {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      width: 100%;
      padding: 0;
    }

    .kiosk-embed-wrap {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
    }

    .kiosk-embed-iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: transparent;
    }
  </style>
{% endblock %}

{% block content %}
  <section class="welcome-section page-shell kiosk-embed-page">
    <div class="container-fluid">
      <div class="kiosk-embed-wrap">
        <iframe
          class="kiosk-embed-iframe"
          src="{{ url_for('kiosk.kiosk_board_all') }}"
          title="Kiosk Ordini"
          loading="lazy">
        </iframe>
      </div>
    </div>
  </section>
{% endblock %}
