{% extends "base.html" %}

{% block extra_css %}
  {{ super() }}
  <style>
    /* Solo per questa pagina: rendi il MAIN .container full-width */
    main.container.py-4 {
      max-width: none !important;
      width: 100% !important;
    }

    /* Se bootstrap assegna padding laterale al container, azzeralo */
    main.container.py-4 {
      padding-left: 0 !important;
      padding-right: 0 !important;
    }

    /* 1) forza full-width SOLO in questa pagina */
    .welcome-section {
      max-width: none !important;
      width: 100% !important;
      padding-left: 0 !important;
      padding-right: 0 !important;
    }

    /* se base.html usa container / container-fluid dentro welcome-section */
    .welcome-section .container,
    .welcome-section .container-fluid {
      max-width: none !important;
      width: 100% !important;
      padding-left: 0 !important;
      padding-right: 0 !important;
    }

    /* 2) area iframe: piena larghezza + altezza viewport sotto navbar */
    .kiosk-embed-wrap {
      width: 100% !important;
      height: calc(100vh - 120px); /* regola se serve */
      min-height: 600px;
    }

    .kiosk-embed-iframe {
      width: 100% !important;
      height: 100%;
      border: 0;
      display: block;
      background: transparent;
    }
  </style>
{% endblock %}

{% block content %}
  <div class="kiosk-embed-wrap">
    <iframe
      class="kiosk-embed-iframe"
      src="{{ url_for('kiosk.kiosk_board_all') }}"
      title="Kiosk Ordini"
      loading="lazy">
    </iframe>
  </div>
{% endblock %}
