{% extends "base.html" %}

{% block title %}LD Enoteca - Bacheca ordini{% endblock %}

{% block extra_css %}
  {{ super() }}
  <style>
    .kiosk-embed-page {
      width: 100%;
      max-width: none;
      height: 100%;
      margin: 0;
      padding: 18px;
      overflow: hidden;
      background: rgba(74, 44, 42, .88);
      border: 1px solid rgba(255, 255, 255, .26);
      box-shadow: 0 18px 42px rgba(0, 0, 0, .22);
    }

    .kiosk-embed-page > .container-fluid {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      width: 100%;
      padding: 0;
    }

    .kiosk-embed-wrap {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      overflow: hidden;
      border-radius: 8px;
    }

    .kiosk-embed-iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: transparent;
    }
    @media (max-width: 820px), (hover: none) and (pointer: coarse) {
      .kiosk-embed-page {
        width: 100%;
        max-width: none;
        min-height: 100%;
        margin: 0;
        padding: 0;
        border-radius: 8px;
      }

      .kiosk-embed-wrap {
        border-radius: 8px;
      }
    }
  </style>
{% endblock %}

{% block content %}
  <section class="welcome-section page-shell kiosk-embed-page">
    <div class="container-fluid">
      <div class="kiosk-embed-wrap">
        <iframe
          class="kiosk-embed-iframe"
          src="{{ url_for('kiosk.kiosk_board_all') }}"
          title="Kiosk Ordini"
          loading="lazy">
        </iframe>
      </div>
    </div>
  </section>
{% endblock %}
