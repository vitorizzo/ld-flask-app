{% extends "base.html" %}

{% block head %}
  {{ super() }}
  <style>
    /* contenitore full-width sotto la navbar */
    .kiosk-embed-wrap {
      width: 100%;
      height: calc(100vh - 110px); /* regola se la tua navbar è più alta/bassa */
      min-height: 600px;
      padding: 0;
    }

    .kiosk-embed-iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: transparent;
    }
  </style>
{% endblock %}

{% block content %}
  <div class="kiosk-embed-wrap">
    <iframe
      class="kiosk-embed-iframe"
      src="/kiosk/overview"
      title="Kiosk Ordini"
      loading="lazy">
    </iframe>
  </div>
{% endblock %}
