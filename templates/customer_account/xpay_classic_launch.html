{% extends "base.html" %}
{% block title %}Connessione a Nexi XPay{% endblock %}
{% block content %}
<main class="container py-5 text-center">
  <div class="card shadow-sm mx-auto" style="max-width: 34rem">
    <div class="card-body p-4 p-md-5">
      <div class="spinner-border text-primary mb-3" role="status"><span class="visually-hidden">Caricamento</span></div>
      <h1 class="h4">Connessione alla pagina sicura Nexi</h1>
      <p class="text-muted">Importo: {{ '%.2f'|format(payment_case.declared_amount)|replace('.', ',') }} €</p>
      <form id="nexiClassicPaymentForm" method="post" action="{{ endpoint }}" accept-charset="ISO-8859-1">
        {% for name, value in fields.items() %}<input type="hidden" name="{{ name }}" value="{{ value }}">{% endfor %}
        <button class="btn btn-success btn-lg" type="submit">Continua su Nexi</button>
      </form>
      <noscript><p class="mt-3 mb-0 text-muted">JavaScript non è attivo: premi “Continua su Nexi”.</p></noscript>
    </div>
  </div>
</main>
<script>document.getElementById("nexiClassicPaymentForm").submit();</script>
{% endblock %}
