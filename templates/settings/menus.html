<h1>Gestione Menu</h1>
<form method="POST">
    <input type="text" name="name" placeholder="Nome menu" required>
    <input type="text" name="route" placeholder="Route (es. /eventi)">
    <select name="parent_id">
        <option value="">Menu principale</option>
        {% for menu in menus %}
        <option value="{{ menu.id }}">{{ menu.name }}</option>
        {% endfor %}
    </select>
    <input type="number" name="weight" placeholder="Ordine" min="0">
    <button type="submit">Salva</button>
</form>
<ul>
    {% for menu in menus %}
    <li>
        {{ menu.name }} ({{ menu.route or "Nessuna route" }})
        <ul>
            {% for child in menu.children %}
            <li>{{ child.name }} ({{ child.route }})</li>
            {% endfor %}
        </ul>
    </li>
    {% endfor %}
</ul>
