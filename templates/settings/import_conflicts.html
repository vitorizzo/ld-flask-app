{% extends 'base.html' %}

{% block title %}Conflitti Import{% endblock %}

{% block content %}
<section class="welcome-section">
  <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
    <div>
      <h1>Risoluzione conflitti di importazione</h1>
      <div id="conflict-type"><p>Caricamento...</p></div>
    </div>

    <div class="d-flex gap-2">
      <a class="btn btn-enabled-custom" href="/" id="btn-exit">
        Esci
      </a>
    </div>
  </div>

  <hr class="my-3">

  <!-- Dato certo (es. cod_art) -->
  <div class="mb-3" id="key-box" style="display:none;">
    <div class="p-3 rounded border">
      <div class="text-muted small">Dato certo</div>
      <div class="fs-5 fw-semibold" id="conflict-key"></div>
    </div>
  </div>

  <!-- 2 box affiancati -->
  <div class="row g-3" id="compare-box" style="display:none;">
    <div class="col-12 col-lg-6">
      <div class="p-3 rounded border h-100">
        <div class="d-flex align-items-center justify-content-between">
          <h5 class="mb-0">CSV</h5>
          <span class="badge bg-success">Sorgente import</span>
        </div>
        <div class="mt-3" id="csv-fields"></div>
      </div>
    </div>

    <div class="col-12 col-lg-6">
      <div class="p-3 rounded border h-100">
        <div class="d-flex align-items-center justify-content-between">
          <h5 class="mb-0">DB</h5>
          <span class="badge bg-secondary">Valori attuali</span>
        </div>
        <div class="mt-3" id="db-fields"></div>
      </div>
    </div>
  </div>

  <!-- Azioni -->
  <div class="mt-4 d-flex flex-wrap gap-2" id="actions" style="display:none;">
    <button class="btn btn-success" id="btn-keep-csv">Usa CSV</button>
    <button class="btn btn-secondary" id="btn-keep-db">Usa DB</button>

    <div class="vr d-none d-md-block"></div>

    <button class="btn btn-outline-primary" id="btn-skip">Salta</button>
  </div>

  <!-- Output / debug / stato -->
  <div class="mt-3">
    <div class="text-muted small" id="status-line"></div>
    <pre class="mt-2 p-3 rounded border bg-light d-none" id="debug-out"></pre>
  </div>
</section>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/import_conflicts.js') }}"></script>
{% endblock %}
