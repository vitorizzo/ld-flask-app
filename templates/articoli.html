{% extends 'base.html' %}

{% block title %}LD Enoteca - Home{% endblock %}

{% block content %}
<section class="welcome-section">
  <!-- Sezione di ricerca barcode -->
  <div class="barcode-search">
    <label for="barcode">Inserisci il codice a barre:</label>
    <input type="text" id="barcode" placeholder="Codice a barre">
    <button id="search-button">Cerca</button>
    <!-- Pulsante per avviare la scansione tramite fotocamera -->
    <button id="scan-button">Scansiona Codice</button>
  </div>

  <!-- Scheda prodotto -->
  <div id="product-card" style="display: none; margin-top:20px;">
    <img id="product-image" src="" alt="Immagine Prodotto" style="max-width: 200px;">
    <div id="product-details">
      <p id="product-code"></p>
      <p id="product-description"></p>
      <p id="product-price"></p>
      <p id="product-stock"></p>
    </div>
  </div>
</section>

<!-- Modal per la scansione -->
<div id="scanner-modal" class="modal" style="display:none;">
  <div class="modal-content">
    <span id="close-scanner" class="close">&times;</span>

    <!-- Selettore fotocamera e pulsanti -->
    <div style="margin: 10px 0;">
      <button id="requestPermissionBtn">1) Richiedi Permesso Fotocamera</button>
      <br><br>
      <label for="videoSource">2) Seleziona fotocamera:</label>
      <select id="videoSource"></select>
      <br><br>
      <button id="startScannerBtn" disabled>3) Avvia Scanner</button>
      <button id="stopScannerBtn" style="display:none;">Ferma Scanner</button>
    </div>

    <!-- Contenitore dove Quagga2 inietterà il suo <video> -->
    <div id="video-container" style="width: 100%; max-width: 400px; height: 300px; margin: 0 auto; background-color: #666; position: relative;">
      <!-- Quagga2 creerà qui il video in tempo reale -->
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<!-- Carichiamo Quagga2 (versione advanced) dal CDN. Assicurati che funzioni (200 OK). -->
<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {
  // =========================
  // 1) RICERCA MANUALE
  // =========================
  const searchButton = document.getElementById("search-button");
  if (!searchButton) {
    console.error("Il bottone 'Cerca' non è stato trovato nel DOM.");
    return;
  }

  searchButton.addEventListener("click", function(){
    const barcode = document.getElementById("barcode").value.trim();
    if (!barcode) {
      alert("Inserisci un codice a barre valido.");
      return;
    }

    // Esegui la richiesta al backend
    fetch('/search/articolo_by_barcode?barcode=' + encodeURIComponent(barcode))
      .then(response => response.json())
      .then(data => {
        if(data && data.success){
          document.getElementById("product-image").src = data.product.image;
          document.getElementById("product-code").textContent = data.product.codice;
          document.getElementById("product-description").textContent = data.product.descrizione;
          document.getElementById("product-price").textContent = "Prezzo: " + data.product.prezzo;
          document.getElementById("product-stock").textContent = "Giacenza: " + data.product.instore;
          document.getElementById("product-card").style.display = "block";
        } else {
          alert("Prodotto non trovato!");
          document.getElementById("product-card").style.display = "none";
        }
      })
      .catch(err => {
        console.error("Errore durante la fetch:", err);
        alert("Errore durante la ricerca del prodotto.");
      });
  });

  // =========================
  // 2) SCANSIONE LIVE QUAGGA2
  // =========================

  // Elementi UI
  const scanButton          = document.getElementById("scan-button");
  const modal               = document.getElementById("scanner-modal");
  const closeModal          = document.getElementById("close-scanner");
  const requestPermissionBtn= document.getElementById("requestPermissionBtn");
  const videoSelect         = document.getElementById("videoSource");
  const startScannerBtn     = document.getElementById("startScannerBtn");
  const stopScannerBtn      = document.getElementById("stopScannerBtn");
  const videoContainer      = document.getElementById("video-container");

  // Mostra il modal
  scanButton.addEventListener("click", function() {
    modal.style.display = "block";
    // Disabilitiamo "Avvia Scanner" finché non abbiamo i permessi e la lista fotocamere
    startScannerBtn.disabled = true;
  });

  // Chiude il modal e ferma lo scanner
  closeModal.addEventListener("click", function(){
    modal.style.display = "none";
    stopScanner();
  });

  // --- Fase 1: Richiesta permessi (iOS-friendly) ---
  requestPermissionBtn.addEventListener("click", function() {
    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => {
        // Chiudiamo subito lo stream, ci serviva solo per far apparire il prompt
        stream.getTracks().forEach(track => track.stop());
        console.log("Permesso fotocamera ottenuto. Ora enumeriamo i dispositivi.");
        listCameras();
      })
      .catch(err => {
        console.error("Errore permessi fotocamera:", err);
        alert("Permesso fotocamera negato o impossibile da ottenere!");
      });
  });

  // --- Fase 2: Elenca fotocamere e avvia scanner ---
  function listCameras() {
    navigator.mediaDevices.enumerateDevices()
      .then(deviceInfos => {
        // Svuota il <select>
        while (videoSelect.firstChild) {
          videoSelect.removeChild(videoSelect.firstChild);
        }
        let foundCam = false;
        deviceInfos.forEach(function(deviceInfo) {
          if (deviceInfo.kind === 'videoinput') {
            foundCam = true;
            const option = document.createElement('option');
            option.value = deviceInfo.deviceId;
            option.text  = deviceInfo.label || ("Fotocamera " + (videoSelect.length + 1));
            videoSelect.appendChild(option);
          }
        });
        if (!foundCam) {
          alert("Nessuna fotocamera trovata!");
        } else {
          // Abilitiamo "Avvia Scanner"
          startScannerBtn.disabled = false;
        }
      })
      .catch(err => {
        console.error("Errore enumerazione dispositivi:", err);
        alert("Impossibile elencare le fotocamere!");
      });
  }

  // Clic su "Avvia Scanner"
  startScannerBtn.addEventListener("click", function() {
    if (!videoSelect.value) {
      alert("Nessuna fotocamera selezionata!");
      return;
    }
    startScannerBtn.disabled = true;
    stopScannerBtn.style.display = "inline-block";
    initQuagga2(videoSelect.value);
  });

  // Ferma manualmente lo scanner
  stopScannerBtn.addEventListener("click", function() {
    stopScanner();
  });

  // =========================
  // 3) Configurazione Avanzata Quagga2
  // =========================
  function initQuagga2(deviceId) {
    // Se Quagga stava già girando, stop
    if (window._quaggaRunning) {
      Quagga.stop();
      window._quaggaRunning = false;
    }

    // Config avanzato
    const config = {
      inputStream: {
        name: "Live",
        type: "LiveStream",
        target: videoContainer,
        constraints: {
          deviceId: { exact: deviceId }
        }
      },
      locator: {
        patchSize: "large",  // x-small, small, medium, large
        halfSample: false
      },
      locate: true,
      // Se vuoi limitare l'area di scansione, scommenta:
      /*
      area: {
        top: "20%",
        right: "20%",
        left: "20%",
        bottom: "20%"
      },
      */
      decoder: {
        // Formati di codice a barre che vuoi riconoscere
        readers: [
          "code_128_reader",
          "ean_reader",
          "ean_8_reader",
          "upc_reader",
          "upc_e_reader"
        ]
      },
      numOfWorkers: 2,  // se il dispositivo è multicore
      frequency: 10,    // analizza un frame ogni ~10ms
      debug: {
        drawBoundingBox: true,
        showFrequency: true,
        drawScanline: true,
        showPattern: true
      }
    };

    Quagga.init(config, function(err) {
      if (err) {
        console.error("Errore init Quagga2:", err);
        alert("Impossibile avviare lo scanner!");
        startScannerBtn.disabled = false;
        stopScannerBtn.style.display = "none";
        return;
      }
      Quagga.start();
      window._quaggaRunning = true;
      console.log("Quagga2 avviato con config avanzata.");

      // Meccanismo di “conferma multipla”
      let lastCode = null;
      let count = 0;
      const REQUIRED_COUNT = 3;

      Quagga.onDetected(data => {
        const code = data.codeResult.code;
        // Se il codice è lo stesso dell'ultimo frame, incrementa contatore
        if (code === lastCode) {
          count++;
        } else {
          lastCode = code;
          count = 1;
        }

        // Se raggiungiamo la soglia di conferma, consideriamo il codice affidabile
        if (count >= REQUIRED_COUNT) {
          console.log("Codice confermato:", code);

          // Inseriamo il codice nell'input
          document.getElementById("barcode").value = code;
          // Simuliamo il click su "Cerca"
          document.getElementById("search-button").click();

          // Ferma lo scanner e chiudi il modal
          stopScanner();
          modal.style.display = "none";
        }
      });
    });
  }

  // Ferma lo scanner
  function stopScanner() {
    if (window._quaggaRunning) {
      Quagga.stop();
      window._quaggaRunning = false;
      console.log("Scanner fermato.");
    }
    startScannerBtn.disabled = false;
    stopScannerBtn.style.display = "none";
  }
});
</script>

<style>
/* --- Stili per il modal --- */
.modal {
  position: fixed;
  z-index: 1000;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: rgba(0,0,0,0.7);
}
.modal-content {
  position: relative;
  margin: 5% auto;
  padding: 20px;
  width: 80%;
  max-width: 500px;
  background-color: #fff;
}
.close {
  position: absolute;
  top: 5px;
  right: 10px;
  font-size: 30px;
  font-weight: bold;
  cursor: pointer;
}
/* Contenitore per il video di Quagga2 */
#video-container {
  position: relative;
  width: 100%;
  max-width: 400px;
  height: 300px;
  margin: 0 auto;
  background-color: #666;
}
</style>
{% endblock %}
