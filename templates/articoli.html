{% extends 'base.html' %}

{% block title %}LD Enoteca - Home{% endblock %}

{% block content %}
<section class="welcome-section">
  <!-- Sezione di ricerca barcode -->
  <div class="barcode-search">
    <label for="barcode">Inserisci il codice a barre:</label>
    <input type="text" id="barcode" placeholder="Codice a barre">
    <button id="search-button">Cerca</button>
    <!-- Pulsante per avviare la scansione tramite fotocamera -->
    <button id="scan-button">Scansiona Codice</button>
  </div>

  <!-- Scheda prodotto -->
  <div id="product-card" style="display: none; margin-top:20px;">
    <img id="product-image" src="" alt="Immagine Prodotto" style="max-width: 200px;">
    <div id="product-details">
      <p id="product-code"></p>
      <p id="product-description"></p>
      <p id="product-price"></p>
      <p id="product-stock"></p>
    </div>
  </div>
</section>

<!-- Modal per la scansione -->
<div id="scanner-modal" class="modal" style="display:none;">
  <div class="modal-content">
    <span id="close-scanner" class="close">&times;</span>
    <div id="video-container" style="position: relative">
      <!-- Overlay per evidenziare l'area di scansione -->
      <div id="scanner-overlay"></div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<!-- Carica la libreria QuaggaJS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {
  var searchButton = document.getElementById("search-button");
  console.log("Hai premuto Cerca");
  if (!searchButton) {
    console.error("Il bottone non è stato trovato nel DOM.");
    return;
  }

  // --- Ricerca manuale del codice a barre ---
  searchButton.addEventListener("click", function(){
    var barcode = document.getElementById("barcode").value;
    console.log("Barcode inserito:", barcode);

    if (!barcode.trim()) {
      alert("Inserisci un codice a barre valido.");
      return;
    }

    // Esegui la richiesta al backend
    fetch('/search/articolo_by_barcode?barcode=' + encodeURIComponent(barcode))
      .then(response => response.json())
      .then(data => {
        if(data && data.success){
          document.getElementById("product-image").src = data.product.image;
          document.getElementById("product-code").textContent = data.product.codice;
          document.getElementById("product-description").textContent = data.product.descrizione;
          document.getElementById("product-price").textContent = "Prezzo: " + data.product.prezzo;
          document.getElementById("product-stock").textContent = "Giacenza: " + data.product.instore;
          document.getElementById("product-card").style.display = "block";
        } else {
          alert("Prodotto non trovato!");
          document.getElementById("product-card").style.display = "none";
        }
      })
      .catch(err => {
        console.error("Errore durante la fetch:", err);
        alert("Errore durante la ricerca del prodotto.");
      });
  });

  // --- Gestione del modal per la scansione ---
  var scanButton = document.getElementById("scan-button");
  var modal = document.getElementById("scanner-modal");
  var closeModal = document.getElementById("close-scanner");

  scanButton.addEventListener("click", function(){
    modal.style.display = "block";
    startScanner();
  });

  closeModal.addEventListener("click", function(){
    modal.style.display = "none";
    Quagga.stop();
  });

  // --- Funzione per iniziare la scansione con QuaggaJS ---
  function startScanner() {
    Quagga.init({
      inputStream: {
        name: "Live",
        type: "LiveStream",
        target: document.querySelector('#video-container'),
        constraints: {
          // Su smartphone, "environment" usa la fotocamera posteriore
          // Se sei su PC, valuta di rimuovere facingMode o usare "user"
          facingMode: "environment"
        }
      },
      decoder: {
        // Aggiungi i formati che vuoi decodificare
        readers: [
          { format: "ean_reader",     config: {} },
          { format: "code_128_reader",config: {} }
          //{ format: "qr_reader",      config: {} }
        ],
        multiple: false
      },
      locate: true,
      locator: {
        halfSample: false,   // Se "true", Quagga elabora l'immagine a metà risoluzione (più veloce, ma meno preciso)
        patchSize: "large"   // Possibili valori: "x-small", "small", "medium", "large"
      },
      // Se hai problemi di prestazioni, puoi aumentare numOfWorkers
      // Se vuoi debug più immediato, metti 0 (usa thread principale)
      numOfWorkers: 0,
      // Frequenza con cui vengono analizzati i frame
      frequency: 10,
      debug: {
        drawBoundingBox: true,
        showFrequency: true,
        drawScanline: true,
        showPattern: true
      }
    }, function (err) {
      if (err) {
        console.error(err);
        alert("Errore nell'avvio dello scanner.");
        return;
      }

      // Avvia la scansione
      Quagga.start();

      // Debug: mostra informazioni su ogni frame elaborato
      Quagga.onProcessed(function (result) {
        console.log("Frame analizzato:", result);
      });

      // Quando viene rilevato un codice valido
      Quagga.onDetected(function (data) {
        var code = data.codeResult.code;
        console.log("Codice rilevato:", code);

        // Ferma lo scanner e chiudi il modal
        Quagga.stop();
        document.getElementById("scanner-modal").style.display = "none";

        // Inserisci il codice rilevato nell'input e lancia la ricerca
        document.getElementById("barcode").value = code;
        document.getElementById("search-button").click();
      });
    });
  }
});
</script>

<!-- Stili inline: puoi spostarli in un file CSS a parte -->
<style>
/* --- Stili per il modal --- */
.modal {
  position: fixed;
  z-index: 1000;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: rgba(0,0,0,0.7);
}
.modal-content {
  position: relative;
  margin: 5% auto;
  padding: 0;
  width: 80%;
  max-width: 400px;
  background-color: #000;
}
.close {
  position: absolute;
  top: 5px;
  right: 10px;
  font-size: 30px;
  font-weight: bold;
  color: #fff;
  cursor: pointer;
}

/* --- Container del video e overlay --- */
#video-container {
  position: relative;
  width: 100%;
  max-width: 400px;  /* Larghezza massima */
  height: 600px;     /* Altezza fissa */
  margin: 0 auto;
  overflow: hidden;
}

#video-container video {
  width: 100%;
  height: 100%;
  object-fit: cover; /* Riempi il container ritagliando l'eccesso */
}

#scanner-overlay {
  position: absolute;
  border: 2px solid #00FF00;
  width: 60%;
  height: 30%;
  top: 35%;
  left: 20%;
}
</style>
{% endblock %}
