{% extends 'base.html' %}

{% block title %}LD Enoteca - Home{% endblock %}

{% block content %}
<section class="welcome-section">
  <!-- Sezione di ricerca barcode -->
  <div class="barcode-search">
    <label for="barcode">Inserisci il codice a barre:</label>
    <input type="text" id="barcode" placeholder="Codice a barre">
    <button id="search-button">Cerca</button>
    <!-- Pulsante per avviare la scansione tramite fotocamera -->
    <button id="scan-button">Scansiona Codice</button>
  </div>

  <!-- Scheda prodotto -->
  <div id="product-card" style="display: none; margin-top:20px;">
    <img id="product-image" src="" alt="Immagine Prodotto" style="max-width: 200px;">
    <div id="product-details">
      <p id="product-code"></p>
      <p id="product-description"></p>
      <p id="product-price"></p>
      <p id="product-stock"></p>
    </div>
  </div>
</section>

<!-- Modal per la scansione -->
<div id="scanner-modal" class="modal" style="display:none;">
  <div class="modal-content">
    <!-- Pulsante di chiusura in alto a destra -->
    <span id="close-scanner" class="close">&times;</span>
    <!-- Pulsante per fermare la scansione -->
    <button id="stopScannerBtn" class="stop-scanner-btn">Ferma Scansione</button>
    <!-- Pulsante per switchare il comparto della fotocamera (back/front) -->
    <button id="switchCameraBtn" class="switch-camera-btn">Switch Camera</button>

    <!-- Wrapper per il video e l'overlay -->
    <div id="video-wrapper" style="position: relative; width: 100%; height: calc(100% - 220px);">
      <!-- Contenitore dove Quagga2 inietterà il video -->
      <div id="video-container"></div>
      <!-- Overlay per evidenziare l'area di scansione -->
      <div id="scanner-overlay"></div>
    </div>

    <!-- Pannello di debug: controlli e informazioni -->
    <div id="camera-controls">
      <h4>Seleziona fotocamera ({{ currentCameraMode|default("back") }})</h4>
      <div id="camera-options"></div>
    </div>
    <div id="debug-panel">
      <div id="constraints-info"></div>
      <div id="selected-camera-info"></div>
    </div>

    <span id="scan-message" class="hint">Posiziona il codice a barre all'interno del rettangolo verde.</span>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<!-- Carichiamo Quagga2 dal CDN -->
<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>

<script>
// Variabili globali per la gestione della fotocamera
let videoDevices = [];
let selectedCameraId = null;
let currentCameraMode = "back"; // "back" o "front"

document.addEventListener("DOMContentLoaded", function() {
  // =========================
  // 1) RICERCA MANUALE
  // =========================
  const searchButton = document.getElementById("search-button");
  if (!searchButton) {
    console.error("Il bottone 'Cerca' non è stato trovato nel DOM.");
    return;
  }
  searchButton.addEventListener("click", function(){
    const barcode = document.getElementById("barcode").value.trim();
    if (!barcode) {
      alert("Inserisci un codice a barre valido.");
      return;
    }
    fetch('/search/articolo_by_barcode?barcode=' + encodeURIComponent(barcode))
      .then(response => response.json())
      .then(data => {
        if(data && data.success){
          document.getElementById("product-image").src = data.product.image;
          document.getElementById("product-code").textContent = data.product.codice;
          document.getElementById("product-description").textContent = data.product.descrizione;
          document.getElementById("product-price").textContent = "Prezzo: " + data.product.prezzo;
          document.getElementById("product-stock").textContent = "Giacenza: " + data.product.instore;
          document.getElementById("product-card").style.display = "block";
        } else {
          alert("Prodotto non trovato!");
          document.getElementById("product-card").style.display = "none";
        }
      })
      .catch(err => {
        console.error("Errore durante la fetch:", err);
        alert("Errore durante la ricerca del prodotto.");
      });
  });

  // =========================
  // 2) SCANSIONE LIVE CON QUAGGA2
  // =========================
  const scanButton       = document.getElementById("scan-button");
  const modal            = document.getElementById("scanner-modal");
  const closeModal       = document.getElementById("close-scanner");
  const stopScannerBtn   = document.getElementById("stopScannerBtn");
  const switchCameraBtn  = document.getElementById("switchCameraBtn");
  const videoContainer   = document.getElementById("video-container");

  scanButton.addEventListener("click", function() {
    modal.style.display = "block";
    enumerateVideoDevices().then(() => {
      displaySupportedConstraints();
      displayCameraOptions();
      startScanner();
    });
  });
  closeModal.addEventListener("click", function(){
    modal.style.display = "none";
    stopScanner();
  });
  stopScannerBtn.addEventListener("click", function(){
    modal.style.display = "none";
    stopScanner();
  });
  switchCameraBtn.addEventListener("click", function(){
    // Switch tra i comparti: se "back", passa a "front", altrimenti a "back"
    currentCameraMode = (currentCameraMode === "back") ? "front" : "back";
    // Seleziona la prima fotocamera disponibile del nuovo gruppo
    const availableGroup = videoDevices.filter(device => {
      return device.label.toLowerCase().includes(currentCameraMode);
    });
    if (availableGroup.length > 0) {
      selectedCameraId = availableGroup[0].deviceId;
    }
    console.log("Switching camera mode to:", currentCameraMode, "New deviceId:", selectedCameraId);
    displaySelectedCameraInfo();
    stopScanner();
    startScanner();
    displayCameraOptions();
  });

  // Enumerazione dei dispositivi video filtrando per comparto corrente
  function enumerateVideoDevices() {
    return navigator.mediaDevices.enumerateDevices().then(devices => {
      videoDevices = devices.filter(device => device.kind === "videoinput");
      if(videoDevices.length > 0) {
        const availableGroup = videoDevices.filter(device => {
          return device.label.toLowerCase().includes(currentCameraMode);
        });
        if(availableGroup.length > 0) {
          selectedCameraId = availableGroup[0].deviceId;
        } else {
          // Fallback: se non ci sono dispositivi per il comparto attuale, usa il primo
          selectedCameraId = videoDevices[0].deviceId;
        }
      }
      displaySelectedCameraInfo();
    }).catch(err => {
      console.error("Errore durante l'enumerazione dei dispositivi video:", err);
    });
  }

  // Avvia Quagga2 utilizzando il dispositivo selezionato
  function startScanner() {
    if (window._quaggaRunning) {
      Quagga.stop();
      window._quaggaRunning = false;
    }
    const config = {
      inputStream: {
        name: "Live",
        type: "LiveStream",
        target: videoContainer,
        constraints: {
          deviceId: { exact: selectedCameraId },
          facingMode: { ideal: "environment" }
        },
        // Area di scansione (ROI)
        area: {
          top: "25%",
          right: "10%",
          left: "10%",
          bottom: "25%"
        }
      },
      locator: {
        patchSize: "large",
        halfSample: false
      },
      locate: true,
      decoder: {
        readers: [
          "code_128_reader",
          "ean_reader",
          "ean_8_reader",
          "upc_reader",
          "upc_e_reader"
        ]
      },
      numOfWorkers: 2,
      frequency: 10,
      debug: {
        drawBoundingBox: true,
        showFrequency: true,
        drawScanline: true,
        showPattern: true
      }
    };
    Quagga.init(config, function(err) {
      if (err) {
        console.error("Errore init Quagga2:", err);
        alert("Impossibile avviare lo scanner!");
        return;
      }
      Quagga.start();
      window._quaggaRunning = true;
      console.log("Quagga2 avviato.");
      // Logica per confermare il codice (multipla conferma)
      let lastCode = null;
      let count = 0;
      const REQUIRED_COUNT = 3;
      Quagga.onDetected(data => {
        const code = data.codeResult.code;
        if (code === lastCode) {
          count++;
        } else {
          lastCode = code;
          count = 1;
        }
        if (count >= REQUIRED_COUNT) {
          console.log("Codice confermato:", code);
          document.getElementById("barcode").value = code;
          document.getElementById("search-button").click();
          stopScanner();
          modal.style.display = "none";
        }
      });
    });
  }

  // Ferma lo scanner
  function stopScanner() {
    if (window._quaggaRunning) {
      Quagga.stop();
      window._quaggaRunning = false;
      console.log("Scanner fermato.");
    }
  }

  // Visualizza le opzioni di fotocamere (radio button) per il comparto corrente
  function displayCameraOptions() {
    const container = document.getElementById("camera-options");
    container.innerHTML = "";
    container.style.maxHeight = "150px";
    container.style.overflowY = "auto";
    const filteredDevices = videoDevices.filter(device => {
      return device.label.toLowerCase().includes(currentCameraMode);
    });
    if (filteredDevices.length > 0) {
      filteredDevices.forEach((device, index) => {
        const radio = document.createElement("input");
        radio.type = "radio";
        radio.name = "cameraOption";
        radio.value = device.deviceId;
        radio.id = currentCameraMode + "_camera_" + index;
        if(device.deviceId === selectedCameraId) {
          radio.checked = true;
        }
        radio.addEventListener("change", function(){
          selectedCameraId = this.value;
          displaySelectedCameraInfo();
          stopScanner();
          startScanner();
        });
        const label = document.createElement("label");
        label.htmlFor = radio.id;
        label.textContent = device.label || (currentCameraMode === "back" ? "Back Camera " : "Front Camera ") + (index + 1);
        const wrapper = document.createElement("div");
        wrapper.appendChild(radio);
        wrapper.appendChild(label);
        container.appendChild(wrapper);
      });
    } else {
      container.textContent = "Nessuna fotocamera " + currentCameraMode + " trovata.";
    }
  }

  // Aggiorna la selezione dei radio button
  function updateCameraRadioSelection() {
    const radios = document.getElementsByName("cameraOption");
    radios.forEach(radio => {
      radio.checked = (radio.value === selectedCameraId);
    });
  }

  // Mostra le constraint supportate nel pannello di debug
  function displaySupportedConstraints() {
    const constraints = navigator.mediaDevices.getSupportedConstraints();
    const infoDiv = document.getElementById("constraints-info");
    infoDiv.innerHTML = "<strong>Supported Constraints:</strong> " + JSON.stringify(constraints);
  }

  // Mostra informazioni sulla fotocamera attualmente selezionata
  function displaySelectedCameraInfo() {
    const infoDiv = document.getElementById("selected-camera-info");
    const selectedDevice = videoDevices.find(device => device.deviceId === selectedCameraId);
    if(selectedDevice) {
      infoDiv.innerHTML = "<strong>Selected Camera:</strong> " + (selectedDevice.label || "Camera sconosciuta") + " (" + selectedCameraId + ")";
    } else {
      infoDiv.innerHTML = "<strong>Selected Camera:</strong> nessuna";
    }
  }
});
</script>

<style>
/* Modal: posizionamento e dimensioni */
.modal {
  position: absolute;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 1000;
  width: 80%;
  height: 80%;
  top: 10%;
  left: 10%;
  overflow: hidden;
  background-color: rgba(0,0,0,0.7);
}
.modal-content {
  position: relative;
  width: 100%;
  height: 100%;
  background-color: #fff;
}
/* Bottone di chiusura in alto a destra */
.close {
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: 30px;
  font-weight: bold;
  cursor: pointer;
}
/* Bottone "Ferma Scansione" */
.stop-scanner-btn {
  position: absolute;
  top: 10px;
  left: 10px;
  font-size: 16px;
  padding: 6px 12px;
  cursor: pointer;
  z-index: 3;
}
/* Bottone "Switch Camera" */
.switch-camera-btn {
  position: absolute;
  top: 10px;
  left: 150px;
  font-size: 16px;
  padding: 6px 12px;
  cursor: pointer;
  z-index: 3;
}
/* Messaggio di aiuto in basso */
.hint {
  position: absolute;
  bottom: 10px;
  left: 0;
  width: 100%;
  height: 50px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 18px;
  color: blue;
}
/* Wrapper per il video e l'overlay */
#video-wrapper {
  position: relative;
  top: 60px;
  width: 100%;
  height: calc(100% - 220px);
}
/* Contenitore dove Quagga2 inietterà il video */
#video-container {
  position: relative;
  width: 100%;
  height: 100%;
  z-index: 1;
}
#video-container video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
/* Overlay per l'area di scansione */
#scanner-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
  pointer-events: none;
  border: 2px solid #00FF00;
}
#scanner-overlay::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: url("{{ url_for('static', filename='images/barcode.png') }}") no-repeat center center;
  background-size: contain;
  opacity: 0.2;
}
/* Pannello di debug e controlli */
#camera-controls {
  position: absolute;
  bottom: 80px;
  left: 10px;
  right: 10px;
  background: rgba(255,255,255,0.8);
  padding: 5px;
  font-size: 12px;
  color: #333;
  border: 1px solid #ccc;
  margin-bottom: 5px;
}
#debug-panel {
  position: absolute;
  bottom: 10px;
  left: 10px;
  right: 10px;
  background: rgba(255,255,255,0.8);
  padding: 5px;
  font-size: 12px;
  color: #333;
  border: 1px solid #ccc;
}
</style>
{% endblock %}
