{% extends 'base.html' %}

{% block title %}LD Enoteca - Home{% endblock %}

{% block content %}
<section class="welcome-section">
  <!-- Sezione di ricerca barcode -->
  <div class="barcode-search">
    <label for="barcode">Inserisci il codice a barre:</label>
    <input type="text" id="barcode" placeholder="Codice a barre">
    <button id="search-button">Cerca</button>
    <!-- Pulsante per avviare la scansione tramite fotocamera -->
    <button id="scan-button">Scansiona Codice</button>
  </div>

  <!-- Scheda prodotto -->
  <div id="product-card" style="display: none; margin-top:20px;">
    <img id="product-image" src="" alt="Immagine Prodotto" style="max-width: 200px;">
    <div id="product-details">
      <p id="product-code"></p>
      <p id="product-description"></p>
      <p id="product-price"></p>
      <p id="product-stock"></p>
    </div>
  </div>
</section>

<!-- Modal per la scansione -->
<div id="scanner-modal" class="modal" style="display:none;">
  <div class="modal-content">
    <!-- Pulsante di chiusura in alto a destra -->
    <span id="close-scanner" class="close">&times;</span>

    <!-- Contenitore per il video e l'overlay -->
    <div id="video-container">
      <!-- Rettangolo verde (overlay fisso) -->
      <div id="scanner-overlay"></div>
      <!-- Il video verrà iniettato da ZXing in <video id="scanner-video"> -->
      <video id="scanner-video" autoplay playsinline></video>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<!-- Carichiamo la libreria ZXing-JS (browser) in formato UMD -->
<!-- ATTENZIONE: decodeFromConstraints NON esiste in versioni vecchie, usiamo decodeFromVideoConstraints -->
<script src="https://unpkg.com/@zxing/browser@0.1.0-rc.3/umd/index.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {
  // =========================
  // 1) RICERCA MANUALE
  // =========================
  const searchButton  = document.getElementById("search-button");
  const barcodeInput  = document.getElementById("barcode");
  const productCard   = document.getElementById("product-card");

  searchButton.addEventListener("click", function() {
    const barcode = barcodeInput.value.trim();
    if (!barcode) {
      alert("Inserisci un codice a barre valido.");
      return;
    }

    fetch('/search/articolo_by_barcode?barcode=' + encodeURIComponent(barcode))
      .then(response => response.json())
      .then(data => {
        if (data && data.success) {
          document.getElementById("product-image").src = data.product.image;
          document.getElementById("product-code").textContent = data.product.codice;
          document.getElementById("product-description").textContent = data.product.descrizione;
          document.getElementById("product-price").textContent = "Prezzo: " + data.product.prezzo;
          document.getElementById("product-stock").textContent = "Giacenza: " + data.product.instore;
          productCard.style.display = "block";
        } else {
          alert("Prodotto non trovato!");
          productCard.style.display = "none";
        }
      })
      .catch(err => {
        console.error("Errore durante la fetch:", err);
        alert("Errore durante la ricerca del prodotto.");
      });
  });

  // =========================
  // 2) SCANSIONE LIVE ZXing
  // =========================
  const scanButton      = document.getElementById("scan-button");
  const modal           = document.getElementById("scanner-modal");
  const closeModal      = document.getElementById("close-scanner");
  const videoContainer  = document.getElementById("video-container");
  const scannerVideo    = document.getElementById("scanner-video");
  let codeReader        = null;
  let scanning          = false;

  // Inizializziamo il reader
  codeReader = new window.ZXingBrowser.BrowserMultiFormatReader();

  scanButton.addEventListener("click", function() {
    modal.style.display = "block";
    startScannerFirstPass();
  });

  // Chiude il modal e ferma lo scanner
  closeModal.addEventListener("click", function() {
    modal.style.display = "none";
    stopScanner();
  });

  // --- 2.1) PRIMO TENTATIVO: facingMode environment, con decodeFromVideoConstraints ---
  function startScannerFirstPass() {
    stopScanner(); // se c'era già uno scanner attivo

    // Constraints "primo pass"
    const constraints = {
      video: {
        facingMode: { ideal: "environment" }
      }
    };

    // decodeFromVideoConstraints(constraints, videoElement, callback)
    codeReader.decodeFromVideoConstraints(constraints, scannerVideo, (result, err) => {
      if (result) {
        console.log("Codice rilevato (first pass):", result.text);
        handleCodeResult(result.text);
      } else if (err && !(err instanceof window.ZXingBrowser.NotFoundException)) {
        console.error("Errore first pass:", err);
        // Se c'è un errore "serio", fallback
        fallbackEnumeration();
      }
    }).then(() => {
      scanning = true;
      console.log("Scanner avviato (first pass).");
    }).catch((error) => {
      console.error("Errore avvio scanner first pass:", error);
      fallbackEnumeration();
    });
  }

  // --- 2.2) FALLBACK: enumerazione dispositivi
  function fallbackEnumeration() {
    stopScanner();

    codeReader.listVideoInputDevices()
      .then(videoInputDevices => {
        console.log("Dispositivi trovati (fallback):", videoInputDevices);

        if (videoInputDevices.length === 0) {
          alert("Nessuna fotocamera trovata!");
          return;
        }

        // Cerchiamo label che indichino "posteriore"
        let backDeviceId = null;
        for (const device of videoInputDevices) {
          const labelLower = device.label.toLowerCase();
          if (
            labelLower.includes('back') ||
            labelLower.includes('rear') ||
            labelLower.includes('posteriore') ||
            labelLower.includes('environment')
          ) {
            backDeviceId = device.deviceId;
            break;
          }
        }

        // Se non troviamo "back/posteriore", prendiamo la prima
        const selectedDeviceId = backDeviceId || videoInputDevices[0].deviceId;
        decodeFromDeviceId(selectedDeviceId);
      })
      .catch(err => {
        console.error("Errore enumerazione fallback:", err);
        alert("Impossibile accedere alla fotocamera (fallback)!");
      });
  }

  // --- 2.3) Avvio scanner con deviceId specifico
  function decodeFromDeviceId(deviceId) {
    stopScanner();

    codeReader.decodeFromVideoDevice(deviceId, scannerVideo, (result, err) => {
      if (result) {
        console.log("Codice rilevato (fallback enumeration):", result.text);
        handleCodeResult(result.text);
      }
      if (err && !(err instanceof window.ZXingBrowser.NotFoundException)) {
        console.error("Errore fallback decode:", err);
      }
    }).then(() => {
      scanning = true;
      console.log("Scanner avviato (fallback).");
    }).catch((error) => {
      console.error("Errore avvio scanner fallback:", error);
      alert("Non è stato possibile avviare la scansione fallback.");
    });
  }

  // Gestione del codice rilevato
  function handleCodeResult(code) {
    // Inseriamo il codice nell'input e clicchiamo "Cerca"
    barcodeInput.value = code;
    searchButton.click();

    // Chiudiamo la modale e fermiamo lo scanner
    modal.style.display = "none";
    stopScanner();
  }

  // Ferma lo scanner
  function stopScanner() {
    if (scanning && codeReader) {
      codeReader.reset();
      scanning = false;
      console.log("Scanner fermato.");
    }
  }
});
</script>

<style>
/* Posizionamento e dimensioni del modal */
.modal {
  position: fixed;
  z-index: 1000;
  left: 40%;
  top: 10%;
  width: 400px;
  height: 600px;
  overflow: hidden;
  background-color: rgba(0,0,0,0.7);
}
.modal-content {
  position: relative;
  width: 100%;
  height: 100%;
  background-color: #fff;
}
.close {
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: 30px;
  font-weight: bold;
  cursor: pointer;
}

/* Contenitore video + overlay */
#video-container {
  position: absolute;
  top: 50px;
  left: 0;
  width: 100%;
  height: calc(100% - 50px);
  background-color: #666;
  overflow: hidden;
}

/* Il video in cui ZXing mostra il flusso */
#scanner-video {
  width: 100%;
  height: 100%;
  object-fit: cover; /* Ritaglia per riempire */
}

/* Rettangolo verde fisso */
#scanner-overlay {
  position: absolute;
  border: 2px solid #00FF00;
  width: 60%;
  height: 30%;
  top: 35%;
  left: 20%;
  pointer-events: none;
}
</style>
{% endblock %}
