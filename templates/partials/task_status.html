<div id="task-status-wrapper">
    <div id="task-status-bar" class="d-flex align-items-center justify-content-between px-3 py-1">
        <span id="task-status-label">Processi in corso...</span>
        <div id="task-status-progress-container">
            <div id="task-status-progress"></div>
        </div>
        <button id="task-status-expand" class="task-status-expand" type="button" aria-expanded="false" aria-controls="task-status-details" title="Mostra processi">
            <i class="bi bi-chevron-down" aria-hidden="true"></i>
        </button>
    </div>
    <div id="task-status-details" class="d-none">
        <div id="task-status-actions" class="task-status-actions d-none">
            <button id="task-status-clear-errors" class="btn btn-sm btn-outline-warning" type="button">
                Rimuovi errori e residui
            </button>
        </div>
        <ul id="task-status-list" class="list-group list-group-flush mb-0">
            <!-- Singoli task -->
        </ul>
    </div>
</div>
