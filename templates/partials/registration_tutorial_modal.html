<dialog class="registration-tutorial-dialog"
        id="registrationTutorialDialog"
        aria-labelledby="registrationTutorialTitle">
  <div class="registration-tutorial-dialog__header">
    <div>
      <h2 id="registrationTutorialTitle">Come registrarti su LDApp</h2>
      <div>Guida alla registrazione e alla richiesta di accesso Horeca</div>
    </div>
    <button class="registration-tutorial-dialog__close"
            type="button"
            data-registration-tutorial-close
            aria-label="Chiudi il tutorial">
      <i class="fa-solid fa-xmark" aria-hidden="true"></i>
    </button>
  </div>
  <video class="registration-tutorial-dialog__video" controls playsinline preload="auto">
    <source src="{{ url_for('static', filename='tutorials/tutorial-registrazione-horeca-preview-v2.mp4') }}" type="video/mp4">
    Il tuo browser non supporta la riproduzione video.
  </video>
  <p class="registration-tutorial-dialog__note">Chiudi il video per tornare alla registrazione.</p>
</dialog>

<script>
  (() => {
    const dialog = document.getElementById("registrationTutorialDialog");
    const video = dialog?.querySelector("video");
    if (!dialog || !video) return;

    document.querySelectorAll("[data-registration-tutorial-open]").forEach(button => {
      button.addEventListener("click", () => {
        if (typeof dialog.showModal === "function") {
          dialog.showModal();
        } else {
          dialog.setAttribute("open", "");
        }
        video.play().catch(() => {
          // I controlli nativi restano disponibili se il browser blocca l'avvio automatico.
        });
      });
    });

    dialog.querySelector("[data-registration-tutorial-close]")?.addEventListener("click", () => {
      dialog.close();
    });

    dialog.addEventListener("click", event => {
      if (event.target === dialog) dialog.close();
    });

    dialog.addEventListener("close", () => video.pause());
    dialog.addEventListener("cancel", () => video.pause());
  })();
</script>
