{% extends 'base.html' %}

{% block title %}LD Enoteca - Ricerca Prodotto per Descrizione{% endblock %}

{% block content %}
<div class="container mt-4" style="color:black">
    <h2 class="text-center">Ricerca Prodotto</h2>

    <!-- Input di ricerca con icona -->
    <div class="input-group mb-3">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
        <input type="text" id="search-description-input" class="form-control" placeholder="Inserisci parte della descrizione...">
    </div>

    <!-- Checkbox per visualizzare tutti i prodotti -->
    <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="search-show-all-products">
        <label class="form-check-label" for="search-show-all-products">Tutti i prodotti</label>
    </div>

    <!-- Risultati -->
    <div id="search-results-wrapper" class="card shadow-sm mb-4" style="display: none;">
        <ul id="search-results-list" class="list-group list-group-flush"></ul>
    </div>

    <!-- Paginazione -->
    <div id="search-pagination-controls" class="d-flex justify-content-center mt-3" style="display: none;">
        <button id="search-prev-page" class="btn btn-outline-primary me-2" disabled>◀ Precedente</button>
        <span id="search-pagina-info" class="align-self-center"></span>
        <button id="search-next-page" class="btn btn-outline-primary ms-2">Successiva ▶</button>
    </div>
</div>

<!-- Modal per visualizzare la Scheda Articolo -->
<div class="modal fade" id="product-modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Scheda Articolo</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Chiudi"></button>
      </div>
      <div class="modal-body p-0">
        <iframe id="product-modal-iframe" src="" style="width: 100%; height: 500px; border: none;"></iframe>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="{{ url_for('static', filename='js/search_by_description.js') }}"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    if (typeof initSearchByDescription === "function") {
      initSearchByDescription({
        inputId: 'search-description-input',
        showAllCheckboxId: 'search-show-all-products',
        listId: 'search-results-list',
        wrapperId: 'search-results-wrapper',
        pagination: {
          prevId: 'search-prev-page',
          nextId: 'search-next-page',
          infoId: 'search-pagina-info',
          containerId: 'search-pagination-controls'
        },
        modalIframeId: 'product-modal-iframe',
        modalTriggerId: 'product-modal',
        showButton: true, // Mostra solo il pulsante per aprire la scheda
        onRowClick: (prodotto) => {
          // Comportamento custom per l'inventario: popola il form
          document.getElementById("barcode").value = prodotto.codice;
          if (typeof aggiornaValoriArticolo === "function") {
            aggiornaValoriArticolo(prodotto.codice);
          }
        }
      });
    } else {
      console.error("initSearchByDescription non trovato! Assicurati che search_by_description.js sia caricato correttamente.");
    }
  });
</script>
{% endblock %}
