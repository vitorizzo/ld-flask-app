{% extends 'base.html' %}

{% block title %}LD Enoteca – Gestione Azioni{% endblock %}

{% block content %}
<section class="welcome-section">
  <h2>Azioni per Connessione {{ connection.board_name }} (ID:{{ connection.id }})</h2>

  <!-- … dentro <section class="welcome-section"> … -->
  <button id="btn-add-action">Nuova Azione</button>

  <!-- Form nascosto per creare/modificare un’azione -->
  <div id="action-form-container" style="display:none; margin:1em 0; padding:1em; border:1px solid #ccc;">
    <h3 id="action-form-title"></h3>
    <form id="action-form">
      <div>
        <label>Trigger:
          <select id="trigger-type" required>
            <option value="">-- Scegli trigger --</option>
          </select>
        </label>
      </div>
      <div>
        <label>Azione:
          <select id="action-type" required>
            <option value="">-- Scegli azione --</option>
          </select>
        </label>
      </div>
      <div id="trigger-params" style="margin:0.5em 0;">
          <!-- Parametri specifici del trigger -->
      </div>
      <div id="action-params" style="margin:0.5em 0;">
          <!-- Parametri specifici dell'action -->
      </div>
      <button type="submit" id="save-action">Salva Azione</button>
      <button type="submit" id="update-action" style="display:none;">Aggiorna Azione</button>
      <button type="button" id="cancel-action">Annulla</button>

    </form>
  </div>

  <table id="actions-table">
    <thead>
      <tr>
        <th>ID</th><th>Trigger</th><th>Azione</th><th>Config</th><th>Azioni</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</section>
{% endblock %}

{% block extra_js %}
  <!-- espongo l’ID della connessione a JS -->
  <script>
    window.TRELLO_CONN_ID = {{ connection.id }};
  </script>
  <!-- importo solo il file esterno -->
  <script src="{{ url_for('static', filename='js/trello_actions.js') }}"></script>
{% endblock %}
